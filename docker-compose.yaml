version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: mlflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: mlflow

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Hanya jalan otomatis kalau volume postgres_data masih kosong (setup baru).
      # Untuk volume yang sudah ada, buat DB metaflow sekali secara manual — lihat
      # Next_Step.md.
      - ./postgres-init:/docker-entrypoint-initdb.d


  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile

    container_name: mlflow

    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      AWS_DEFAULT_REGION: auto
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow123@postgres:5432/mlflow
      --default-artifact-root s3://${R2_BUCKET_NAME}
      --no-serve-artifacts
      --allowed-hosts "*"


  metaflow-trigger:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: metaflow-trigger

    restart: unless-stopped

    depends_on:
      - mlflow

    ports:
      - "8002:8002"  

    entrypoint: ["python", "workflow/trigger.py"]
    command: ["--serve", "--host", "0.0.0.0", "--port", "8002"]

    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      AWS_DEFAULT_REGION: auto
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_PUBLIC_URL: http://localhost:5000  # dipakai khusus untuk link yang ditampilkan ke user di UI

      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET}

    volumes:
      - retrain_uploads:/app/data/retrain_uploads
      - retrain_configs:/app/configs/_generated
      - retrain_logs:/app/workflow/.logs


