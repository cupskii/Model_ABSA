# CI/CD untuk Deployment Automated ML Workflow Pipeline
# =======================================================
# Implementasi desain Tabel III.8:
#
#   CI : 1. Unit test setiap komponen pipeline (ekstraksi data s.d. registrasi model)
#        2. Build container image berisi seluruh implementasi pipeline + dependensi
#        3. Integration test image pada sampel data kecil & epoch kecil (end-to-end)
#        4. Push image yang lolos ke container registry (Docker Hub)
#   CD : 5. Deploy image ke lingkungan produksi
#        6. Integration test ulang di lingkungan produksi
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   — kredensial Docker Hub
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY — akses SSH server produksi

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/absa-pipeline

jobs:

  # ── CI Tahap 1: Unit Test ───────────────────────────────────────────────────
  unit-test:
    name: Unit test komponen pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r workflow/requirements.txt pytest

      - name: Jalankan unit test
        run: pytest tests/ -v

  # ── CI Tahap 2–4: Build → Integration Test → Push ──────────────────────────
  build-integration-push:
    name: Build image, integration test, push ke registry
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # End-to-end pada sampel kecil (150 baris) & 1 epoch — hanya memastikan
      # pipeline berjalan utuh. MLflow memakai sqlite di dalam container
      # sehingga tidak butuh tracking server.
      - name: Integration test (end-to-end, sampel & epoch kecil)
        run: |
          docker run --rm \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow_ci.db \
            "$IMAGE:${{ github.sha }}" \
            run --config_path configs/integration_test.yaml \
                --trigger_reason ci_integration_test

      - name: Login ke Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image ke container registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ── CD Tahap 5–6: Deploy ke Produksi + Integration Test Ulang ───────────────
  deploy:
    name: Deploy ke produksi
    needs: build-integration-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy dan verifikasi di server produksi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE }}"

            # 5. Deploy: tarik image terbaru menggantikan versi sebelumnya
            docker pull "$IMAGE:latest"

            # 6. Integration test ulang di lingkungan produksi
            docker run --rm \
              -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow_ci.db \
              "$IMAGE:latest" \
              run --config_path configs/integration_test.yaml \
                  --trigger_reason production_smoke_test

            # Perbarui container pipeline terjadwal (retraining bulanan —
            # cron mengikuti schedule di workflow/pipeline_config.yaml)
            ( crontab -l 2>/dev/null | grep -v 'absa-pipeline-scheduled' ;
              echo "0 0 1 * * docker run --rm --env-file /opt/absa/.env --name absa-pipeline-scheduled $IMAGE:latest run --trigger_reason scheduled"
            ) | crontab -

            docker image prune -f
