# CI/CD untuk Deployment Automated ML Workflow Pipeline
# =======================================================
# Implementasi desain Tabel III.8:
#
#   CI : 1. Unit test setiap komponen pipeline (ekstraksi data s.d. registrasi model)
#        2. Build container image berisi seluruh implementasi pipeline + dependensi
#        3. Integration test image pada sampel data kecil & epoch kecil (end-to-end)
#        4. Push image yang lolos ke container registry (GHCR)
#   CD : 5. Deploy image ke lingkungan produksi (mesin lokal via self-hosted runner)
#        6. Integration test ulang di lingkungan produksi
#
# Prasyarat:
#   - Registry: GitHub Container Registry (ghcr.io) — otentikasi otomatis
#     lewat GITHUB_TOKEN, tidak perlu secret registry tambahan.
#   - Job `deploy` butuh self-hosted runner yang terpasang di mesin lokal
#     yang jadi target deploy (Settings → Actions → Runners → New self-hosted
#     runner, jalankan `run.sh`/`run.cmd` di mesin tersebut). Runner harus
#     punya label `self-hosted` dan akses ke Docker daemon lokal.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/absa-pipeline

jobs:

  # ── CI Tahap 1: Unit Test ───────────────────────────────────────────────────
  unit-test:
    name: Unit test komponen pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r workflow/requirements.txt pytest

      - name: Jalankan unit test
        run: pytest tests/ -v

  # ── CI Tahap 2–4: Build → Integration Test → Push ──────────────────────────
  build-integration-push:
    name: Build image, integration test, push ke registry
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # End-to-end pada sampel kecil (150 baris) & 1 epoch — hanya memastikan
      # pipeline berjalan utuh. MLflow memakai sqlite di dalam container
      # sehingga tidak butuh tracking server.
      - name: Integration test (end-to-end, sampel & epoch kecil)
        run: |
          docker run --rm \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow_ci.db \
            "$IMAGE:${{ github.sha }}" \
            run --config_path configs/integration_test.yaml \
                --trigger_reason ci_integration_test

      - name: Login ke GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image ke container registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ── CD Tahap 5–6: Deploy ke Produksi (Lokal) + Integration Test Ulang ───────
  deploy:
    name: Deploy ke produksi (mesin lokal)
    needs: build-integration-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Deploy: tarik image terbaru menggantikan versi sebelumnya
      - name: Pull image terbaru
        run: docker pull "$IMAGE:latest"

      # 6. Integration test ulang di lingkungan produksi
      - name: Integration test ulang (smoke test produksi)
        run: |
          docker run --rm \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow_ci.db \
            "$IMAGE:latest" \
            run --config_path configs/integration_test.yaml \
                --trigger_reason production_smoke_test

      # Trigger server (workflow/trigger.py --serve) menerima pemicu eksternal
      # dari komponen monitoring via HTTP POST /trigger. Container ini persisten
      # (bukan --rm) — di-replace dengan image terbaru tiap kali deploy sukses,
      # --restart unless-stopped supaya tetap hidup lintas restart Docker/mesin.
      - name: Restart trigger server (HTTP endpoint eksternal)
        run: |
          docker rm -f absa-trigger-server 2>/dev/null || true
          docker run -d --restart unless-stopped \
            --name absa-trigger-server \
            --entrypoint python \
            -p 8002:8002 \
            --env-file /opt/absa/.env \
            "$IMAGE:latest" \
            workflow/trigger.py --serve --host 0.0.0.0 --port 8002

      # Perbarui container pipeline terjadwal (retraining bulanan — cron
      # mengikuti schedule di workflow/pipeline_config.yaml)
      - name: Perbarui cron retraining terjadwal
        run: |
          ( crontab -l 2>/dev/null | grep -v 'absa-pipeline-scheduled' ;
            echo "0 0 1 * * docker run --rm --env-file /opt/absa/.env --name absa-pipeline-scheduled $IMAGE:latest run --trigger_reason scheduled"
          ) | crontab -

      - name: Bersihkan image lama
        run: docker image prune -f
