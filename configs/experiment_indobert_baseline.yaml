experiment:
  name: "indobert_absa"
  run_name: "dataset_fix_annotated"
  seed: 42
  description: >
    IndoBERT fine-tuning ABSA Kompas.id — baseline.
    Hyperparameter default umum (belum di-tuning Optuna untuk dataset ini),
    dengan class weighting (kelas None 62-93% per aspek — tanpa weighting
    model cenderung memprediksi None), tanpa CV (single train/val/test split).
    Perbaikan anotasi data terhadap semua aspek
   
data:
  path: "data/raw/dataset_final.csv"
  text_column: "Komentar"
  split:
    # 70% train / 15% val / 15% test
    train_ratio: 0.70
    val_ratio: 0.15
    random_state: 42

preprocessing:
  remove_emoji: true
  lowercase: true
  remove_url_mention: true
  compress_repeated_chars: true
  remove_special_chars: true
  normalize_slang: true
  remove_stopwords: false

# ── KONFIGURASI REPRESENTASI TEKS ────────────────────────────────────────────
# model_revision harus dikunci ke commit hash spesifik setelah eksperimen
# pertama dijalankan, agar pembaruan model tidak mengubah representasi.
# Contoh: model_revision: "abc1234def5678"
representation:
  type: "indobert"
  model_name: "indobenchmark/indobert-base-p1"
  model_revision: "main"
  max_length: 128

model:
  type: "indobert_multitask"
  use_class_weights: true
  save_dir: "model_output"
  params:
    dropout_rate: 0.1
    batch_size: 16
    learning_rate: 2.0e-5
    num_epochs: 20
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    patience: 4

mlflow:
  tracking_uri: http://localhost:5000
  registry_name: "absa_indobert"
  gdrive_dir: "absa_models"
